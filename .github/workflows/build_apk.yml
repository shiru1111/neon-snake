name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          set -o pipefail
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug 2>&1 | tee buildozer.log

      - name: Print Failure Context
        if: failure()
        run: |
          echo "==================== BUILD FAILED - LAST 120 LINES ===================="
          tail -n 120 buildozer.log || true

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeonSnake-Android-APK
          path: bin/*.apk

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
